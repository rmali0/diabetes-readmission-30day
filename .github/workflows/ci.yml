name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::dplyr
            any::tibble
            any::readr
            any::scales
            any::pROC
            any::broom
            any::ggplot2

      # Unit tests run on a 10-row fixture, not the full dataset.
      - name: Run tests
        run: Rscript tests/testthat.R
